name: Build Project Exodus compatibility addon
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: project-exodus-compat-jar
          path: build/libs/*.jar
